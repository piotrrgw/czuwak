name: Build & Publish Android APK (Czuwak)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract APP_VERSION and APP_BUILD from www/env.js
        id: version
        run: |
          APP_VERSION=$(node -e 'const fs=require("fs"); const c=fs.readFileSync("www/env.js","utf8"); const m=c.match(/APP_VERSION\s*=\s*"([^"]+)"/); console.log(m?m[1]:"v1.0.0");')
          APP_BUILD=$(node -e 'const fs=require("fs"); const c=fs.readFileSync("www/env.js","utf8"); const m=c.match(/APP_BUILD\s*=\s*"([^"]+)"/); console.log(m?m[1]:"001");')
          APK_NAME="czuwak(${APP_VERSION})(${APP_BUILD}).apk"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "app_build=$APP_BUILD" >> $GITHUB_OUTPUT
          echo "tag=${APP_VERSION}-build.${APP_BUILD}" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies & sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/czuwak-release.keystore

      - name: Build Signed Release APK with Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APKs for release
        run: |
          APK_NAME="${{ steps.version.outputs.apk_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp android/app/build/outputs/apk/release/app-release.apk czuwak.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: czuwak-apk-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.version.outputs.apk_name }}
            czuwak.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Czuwak ${{ steps.version.outputs.app_version }} (build ${{ steps.version.outputs.app_build }})"
          body: |
            Automatyczne wydanie aplikacji **Czuwak – Asystent Drużyn Konduktorskich** (${{ steps.version.outputs.app_version }}, kompilacja `${{ steps.version.outputs.app_build }}`).
            
            📥 **Bezpośredni link do pobrania pliku z wersją i kompilacją w nazwie:**
            `https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.version.outputs.apk_name }}`
            
            📦 **Stały link uniwersalny:**
            `https://github.com/${{ github.repository }}/releases/latest/download/czuwak.apk`
          files: |
            ${{ steps.version.outputs.apk_name }}
            czuwak.apk
            www/env.js
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
