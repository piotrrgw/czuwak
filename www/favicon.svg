<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Zaokrąglona tarcza aplikacji -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="16"/>

  <!-- Fale radarowe / akustyczne Czuwaka -->
  <path d="M 118 190 A 150 150 0 0 1 394 190" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 18" opacity="0.85"/>
  <path d="M 154 215 A 110 110 0 0 1 358 215" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Tory kolejowe w perspektywie (dół) -->
  <path d="M 148 446 L 216 308 M 364 446 L 296 308" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>
  <line x1="198" y1="336" x2="314" y2="336" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <line x1="178" y1="378" x2="334" y2="378" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <line x1="156" y1="422" x2="356" y2="422" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>

  <!-- Centralny przycisk / lampa Czuwaka SHP/CA -->
  <circle cx="256" cy="240" r="88" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="18"/>
  <circle cx="256" cy="240" r="64" fill="url(#ringGrad)"/>

  <!-- Dzwonek / sygnał alarmowy wewnątrz tarczy Czuwaka -->
  <path d="M 256 192 C 236 192 222 208 222 228 L 222 252 L 210 264 L 302 264 L 290 252 L 290 228 C 290 208 276 192 256 192 Z" fill="#0f172a"/>
  <circle cx="256" cy="276" r="10" fill="#0f172a"/>

  <!-- Punkt świetlny u góry (wskaźnik czuwania) -->
  <circle cx="256" cy="96" r="18" fill="#38bdf8"/>
</svg>