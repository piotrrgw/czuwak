<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Asystent Kas Biletowych</title>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="archGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Tło Squircle -->
  <rect x="0" y="0" width="64" height="64" rx="16" ry="16" fill="url(#bgGrad2)" />
  <rect x="1" y="1" width="62" height="62" rx="15" ry="15" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Łuk okienka kasowego dworca -->
  <path d="M 15,48 V 27 C 15,17 22.5,10 32,10 C 41.5,10 49,17 49,27 V 48" fill="none" stroke="url(#archGrad2)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Lada okienka kasowego -->
  <path d="M 10,48 H 54" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bilet podawany w okienku kasowym -->
  <g transform="rotate(-5 32 36)">
    <rect x="22" y="22" width="20" height="24" rx="2.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Mini pociąg na bilecie -->
    <path fill="#0284c7" d="M 32,25 C 28,25 26,27 26,29 V 37 C 26,38 27,39 28,39 H 36 C 37,39 38,38 38,37 V 29 C 38,27 36,25 32,25 Z" />
    <rect x="28" y="28" width="8" height="4" rx="1" fill="#bae6fd" />
    <circle cx="28.5" cy="35" r="0.8" fill="#fbbf24" />
    <circle cx="35.5" cy="35" r="0.8" fill="#fbbf24" />
    
    <!-- Paski perforacji biletu -->
    <line x1="24.5" y1="41.5" x2="39.5" y2="41.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,1.5,3,1.5" />
  </g>

  <!-- Lampka neonowa: Kasa Czynna (status dworca) -->
  <circle cx="32" cy="15" r="3.5" fill="#10b981" />
  <circle cx="32" cy="15" r="1.5" fill="#ffffff" />
</svg>