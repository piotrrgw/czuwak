<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Asystent Kas Biletowych - Moduł IC</title>
  <defs>
    <linearGradient id="bgGradCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="archGradCobalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Tło Squircle -->
  <rect x="0" y="0" width="64" height="64" rx="16" ry="16" fill="url(#bgGradCobalt)" />
  <rect x="1" y="1" width="62" height="62" rx="15" ry="15" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Łuk okienka kasowego dworca -->
  <path d="M 15,48 V 27 C 15,17 22.5,10 32,10 C 41.5,10 49,17 49,27 V 48" fill="none" stroke="url(#archGradCobalt)" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Lada okienka kasowego -->
  <path d="M 10,48 H 54" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bilet podawany w okienku kasowym -->
  <g transform="rotate(-6 28 34)">
    <rect x="18" y="20" width="20" height="24" rx="2.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Mini pociąg na bilecie w barwach granatowych -->
    <path fill="#1d4ed8" d="M 28,23 C 24.5,23 22.5,25 22.5,27 V 34 C 22.5,35 23.5,36 24.5,36 H 31.5 C 32.5,36 33.5,35 33.5,34 V 27 C 33.5,25 31.5,23 28,23 Z" />
    <rect x="24.5" y="26" width="7" height="3.5" rx="0.8" fill="#dbeafe" />
    <circle cx="25" cy="32.5" r="0.75" fill="#fbbf24" />
    <circle cx="31" cy="32.5" r="0.75" fill="#fbbf24" />
    <!-- Paski perforacji biletu -->
    <line x1="20.5" y1="39" x2="35.5" y2="39" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,1.5,2,1.5" />
  </g>

  <!-- Neonowa lampka statusu dworca -->
  <circle cx="32" cy="15" r="3.5" fill="#10b981" />
  <circle cx="32" cy="15" r="1.5" fill="#ffffff" />

  <!-- Pomarańczowa plakietka (badge) IC w prawym dolnym rogu -->
  <g>
    <rect x="34" y="37" width="24" height="19" rx="6" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.5" />
    <text x="46" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">IC</text>
  </g>
</svg>
